[project]
name = "auto-progress-squad-api"
version = "0.1.0"
description = "Vehicle-aware automotive AI copilot backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.116,<1.0",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<10.0",
]
embedding = [
  "sentence-transformers[openvino]>=6.0,<7.0",
]
generation = [
  "openvino-genai>=2026.3,<2026.4",
]
generation-evaluation = [
  "huggingface-hub>=1.0,<2.0",
  "openvino-genai>=2026.3,<2026.4",
  "psutil>=7.0,<8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
