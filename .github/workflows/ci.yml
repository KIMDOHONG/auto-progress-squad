name: repository-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            docs/problem-definition.md
            docs/use-cases.md
            docs/architecture.md
            docs/roles.md
            tests/README.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Check unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)'             --exclude-dir=.git .; then
            echo "Unresolved merge marker found."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.27"
          enable-cache: true
          cache-dependency-glob: "src/api/uv.lock"

      - name: Install locked backend dependencies
        working-directory: src/api
        run: uv sync --locked --extra test

      - name: Run backend tests
        working-directory: src/api
        run: uv run --locked pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install locked frontend dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: src/web
        run: pnpm test

      - name: Build frontend
        working-directory: src/web
        run: pnpm build
