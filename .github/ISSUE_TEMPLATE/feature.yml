name: 기능 또는 작업
description: 새 기능, 문서, 실험, 조사 작업을 등록합니다.
title: "[TASK] "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 왜 필요한 작업인지 한 문장으로 작성하세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      description: 포함할 일과 제외할 일을 구분하세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인 가능한 체크리스트로 작성하세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 검증 방법
      description: 실행 명령, 테스트, 화면 또는 로그 증거를 적으세요.
  - type: input
    id: owner
    attributes:
      label: 담당자
      placeholder: "@github-id"
